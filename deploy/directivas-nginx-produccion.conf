# ============================================================================
# altdone.platita.es (PRODUCCIÓN) · Directivas adicionales de nginx para Plesk
# Pegar en: Plesk → Sitios web y dominios → altdone.platita.es →
#           Configuración de Apache y nginx → «Directivas adicionales de nginx»
# Alineadas con platita-software/deploy/plesk/directivas-nginx-produccion.conf.
# Si cambias este fichero, vuelve a pegarlo en Plesk: no se aplica solo.
# ============================================================================

# --- Cabeceras de seguridad -------------------------------------------------
# Passenger sirve public/ (HTML y recursos) sin pasar por Express, así que las
# cabeceras de helmet (server.js) solo llegan a /api. Estas cubren todo el sitio.
# HSTS no va aquí: se activa en Plesk → SSL It! (hoy el HTML no lo lleva); repetirlo lo duplica.

# CSP mínima obligatoria (la misma que platita.es)
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# CSP completa en modo informe: no bloquea nada, envía avisos a /api/csp-informe.
# Cuando pase un tiempo sin avisos inesperados, se cambia a Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://stats.javierjg.es; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://stats.javierjg.es; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-informe" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Sin «Phusion Passenger(R) 6.2.0» en las respuestas
proxy_hide_header X-Powered-By;
